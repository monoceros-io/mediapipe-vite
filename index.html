<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MediaPipe Image Segmenter with Pose Landmarker</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="main-column">

        <div class="qc qc-0">
            <video id="vid-0" class="video"></video>
            <select name="cameras-0" id="cameras-0" class="camera-select"></select>

            </select>
            <div class="video-crop-div-outer">

                <div class="video-crop-box">
                    <div class="video-centre-box">
                        ✥
                    </div>
                    <div class="video-scaler-box">
                        ✥
                    </div>
                </div>

                <div class="video-crop-box">
                    <div class="video-centre-box">
                        ✥
                    </div>
                    <div class="video-scaler-box">
                        ✥
                    </div>
                </div>

            </div>
            <canvas width="256" height="256" id="skel-draw-canvas"></canvas>
        </div>



        <div class="qc qc-2" id="qc-full">
            <div class="canvas-container">

                <div class="centred-canvases backing-canvases">

                    <canvas width="960" height="2160" class="backing-canvas bk-cvs" id="backing-canvas-0"></canvas>
                    <canvas width="960" height="2160" class="backing-canvas bk-cvs" id="backing-canvas-1"></canvas>
                </div>

                <div class="centred-canvases camera-mask-canvas">
                    <canvas width="1920" height="2160" class="final-canvas" id="final-canvas"></canvas>
                </div>


                <div class="centred-canvases fore-canvases">
                    <canvas width="960" height="2160" class="backing-canvas fore-canvas" id="fore-canvas-0"></canvas>
                    <canvas width="960" height="2160" class="backing-canvas fore-canvas" id="fore-canvas-1"></canvas>

                </div>
                <div class="centred-canvases photo-stuff">

                    <div class="fore-canvas-text-outer">
                        <div class="fore-canvas-text">
                            <div id="fcount-0" class="fore-big"></div>

                            <div class="flash-white"></div>
                            <div class="photo-overlay-outer">
                                <canvas class="photo-overlay-inner"></canvas>
                            </div>

                        </div>
                        <div class="fore-canvas-text">
                            <div id="fcount-1" class="fore-big"></div>

                            <div class="flash-white"></div>
                            <div class="photo-overlay-outer">
                                <canvas class="photo-overlay-inner"></canvas>
                            </div>
                        </div>
                    </div>

                    <div class="fore-canvas-prep-text">

                        <div class="prep-overlay">
                            <div id="prep-inner-0" class="prep-inner"></div>
                        </div>
                        <div class="prep-overlay">
                            <div id="prep-inner-1" class="prep-inner"></div>
                        </div>

                    </div>


                    <div class="fore-canvas-prep-text">

                    </div>


                    <div class="fore-canvas-prep-text">
                        <div class="cta-overlay">
                            <div id="cta-inner-0" class="cta-inner"></div>
                        </div>
                        <div class="cta-overlay">
                            <div id="prep-inner-0" class="cta-inner"></div>
                        </div>
                    </div>




                </div>

                <div class="centred-canvases hola">
                    <div class="hola-container">
                        <div id="hola-0" class="hola-inner">
                            <div class="hola-text">¡HOLA NICK!</div>
                        </div>
                    </div>
                    <div class="hola-container">
                        <div id="hola-1" class="hola-inner">
                            <div class="hola-text">¡HOLA NICK!</div>
                        </div>
                    </div>
                </div>
               
                <canvas id="photo-canvas" class="photo-canvas" width="975" height="1920">
                </canvas>
                <div class="konva-parent" id="fore-2d-0"></div>
                <div class="konva-parent" id="fore-2d-1"></div>

            </div>
        </div>
    </div>

    <div class="control-panel">

        <label>Izquierda</label>
        <div class="cb-det-sta">Nadie detectado</div>

        <label>Derecha</label>

        <div class="cb-det-sta">Nadie detectado</div>

        <!-- <div class="frame-readout">
            <div>FPS</div>
            <div id="fps">20</div>
        </div> -->
        <label for="">Brillo</label>
        <input type="range" id="brightness" min="-10" max="10" value="0">
        <label for="">Contraste</label>
        <input type="range" id="contrast" min="0" max="10" value="1">
        <span>
            <input min="2" value="1" class="number-input" type="number" id="pose-frames">
            <label class="p-label" for="">cuadros</label>
        </span>

        <button id="fullscreen-btn">Toda la pantalla</button>
        <button id="save-btn">Guardar Configuración</button>

        <!-- === Alpha Threshold Sliders === -->

        <label for="alpha-min">Alpha Min</label>
        <input type="range" id="alpha-min" min="0" max="1" step="0.01" value="0.2" style="width: 120px;">
        <span id="alpha-min-value">0.2</span>
        <label for="alpha-max">Alpha Max</label>
        <input type="range" id="alpha-max" min="0" max="1" step="0.01" value="0.7" style="width: 120px;">
        <span id="alpha-max-value">0.7</span>
        <label for="">Server URL base</label>
        <input type="text" id="server-url" value="http://localhost:3000">
        <div id="conn-stat" class="conn-stat-dis">
            Disconnected
        </div>
        <button id="server-connect">Connect</button>

        <!-- ============================== -->

    </div>

    <script type="module" src="script.js"></script>

</body>

</html>
